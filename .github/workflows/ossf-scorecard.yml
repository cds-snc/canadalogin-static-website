# Note that this workflow is authenticated via a PAT ${{ secrets.SCORECARD_TOKEN }} instead
# of the standard automatically-provided GITHUB_TOKEN. This seems to be required to make the
# action work in private repos.
#
# Context: https://github.com/ossf/scorecard-action/issues/856 and https://github.com/cds-snc/gc-signin-terraform/issues/83
#
# PATs have a maximum lifetime of 1 year. So one year from now, this workflow will break
# and we'll need to regenerate the PAT. Follow the instructions below to do so.
#
# See the document here to learn how to create the PAT needed for this action:
# https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md
#
# I needed to grant additional permissions to the PAT to make this work in a private repository.
# The permissions granted are (all read-only):
#
# Actions, Administration, Code scanning alerts, Commit statuses, Contents, Deployments,
# Environments, Issues, Metadata, Pull requests, Repository security advisories,
# Webhooks, Workflows
#

name: Scorecards supply-chain security
on:
  workflow_dispatch:
  schedule:
    # Weekly on Saturdays.
    - cron: "30 1 * * 6"
  push:
    branches:
      - main

permissions: read-all

jobs:
  analysis:
    name: Scorecards analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
      pull-requests: read
      checks: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: ossf-results.json
          results_format: json
          publish_results: false
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: "Add metadata"
        run: |
          full_repo="${{ github.repository }}"
          OWNER=${full_repo%/*}
          REPO=${full_repo#*/}
          jq -c '. + {"metadata_owner": "'$OWNER'", "metadata_repo": "'$REPO'", "metadata_query": "ossf"}' ossf-results.json > ossf-results-modified.json

      - name: "Post results to Sentinel"
        uses: cds-snc/sentinel-forward-data-action@main
        with:
          file_name: ossf-results-modified.json
          log_type: GitHubMetadata_OSSF_Scorecard
          log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          log_analytics_workspace_key: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
