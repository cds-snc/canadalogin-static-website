on:
  push:
    branches:
      - main
  workflow_dispatch: # Added for ease of debugging for now.
  repository_dispatch: # Triggered by GC Articles pipeline when a new article is published or saved. The DEV website will be rebuilt and redeployed with the updated content.
    types: [gc-articles-update]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  AWS_REGION: ca-central-1
  GITHUB_SHA: ${{ github.sha }}
  SLACK_NOTIFICATION_APPLICATION_NAME: "GC Sign-In Static Website"

name: Release Pipeline - Static Website

jobs:
  # Runs the release-please action. This manages the open release PR and
  # creates the release when the PR is merged.
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: sre_app_token
        with:
          app-id: ${{ secrets.CDS_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.CDS_RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@c2a5a2bd6a758a0937f1ddb1e8950609867ed15c # v4.3.0
        id: release
        with:
          token: ${{ steps.sre_app_token.outputs.token }}

  notify-slack-about-deploy:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.check-envs.outputs.envs }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check what environments are being deployed to
        id: check-envs
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'repository_dispatch'
        run: |
          ENVS_TO_DEPLOY=""
          for file in $(git diff --name-only ${{ github.event.before }} ${{ github.sha }}); do
            if [[ "$file" == .deployed_versions/*.json ]]; then
              ENV_NAME=$(basename $file .json)
              if [ -z "$ENVS_TO_DEPLOY" ]; then
                ENVS_TO_DEPLOY="$ENV_NAME"
              else
                ENVS_TO_DEPLOY="$ENVS_TO_DEPLOY,$ENV_NAME"
              fi
            fi
          done
          echo "Found environments to deploy: $ENVS_TO_DEPLOY"
          echo "envs=$ENVS_TO_DEPLOY" >> $GITHUB_OUTPUT

      - name: Notify slack
        if: steps.check-envs.outputs.envs != ''
        run: |
          workflow_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          json='{"text":":hourglass: '"${{ env.SLACK_NOTIFICATION_APPLICATION_NAME }}"' is being deployed to the following environments: `'"${{ steps.check-envs.outputs.envs }}"'`\n\n<'"$workflow_url"'|Click for more details>"}'

          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.GC_SIGNIN_WEBSITE_OPS_SLACK_INFO_WEBHOOK }}

  # Builds the static website application for the current SHA and stores the artifact in S3.
  build-website:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, test, staging, prod]
    needs: notify-slack-about-deploy
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "latest"

      - name: configure aws credentials using OIDC role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{vars.AWS_ACCOUNT_ID}}:role/github_action_push_S3-canadalogin-static-website
          role-session-name: GHPushAppS3
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Environment Variables for build
        run: |
          echo "WEBSITE_ENVIRONMENT=${{ matrix.environment }}" >> $GITHUB_ENV
          echo "GOOGLE_ANALYTICS_ID=${{ vars.GOOGLE_ANALYTICS_ID }}" >> $GITHUB_ENV

      - name: Install dependencies & Build Application
        working-directory: website
        run: |
          npm install
          npm run build

      - name: Upload build artifacts to S3
        run: |
          aws s3 sync website/_site s3://${{ vars.STATIC_WEBSITE_BUILD_ARTIFACTS_S3_BUCKET }}/${GITHUB_SHA}

  
  # Deploys website application to necessary environments.
  # We check the current SHA deployed to the environment to only deploy if necessary.
  deploy-website:
    needs: [release-please, build-website]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, test, staging, prod]
    environment: ${{ matrix.environment }}
    steps:
      - run: echo "Deploying static website to ${{ matrix.environment }} environment..."

      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      # Set the SHA to use for the deployment.
      # In `dev`, we always use the main sha (the SHA this workflow is running for).
      # In all other environments, we need to resolve the tag in ./deployed_versions/{env}.json["version"]
      - name: Set deployment SHA
        run: |
          if [ "${{ matrix.environment }}" = "dev" ]; then
            echo "DEPLOYMENT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
          else
            DEPLOYMENT_TAG=$(cat .deployed_versions/${{ matrix.environment }}.json | jq -r '.version')
            DEPLOYMENT_SHA=$(git rev-list -n 1 v$DEPLOYMENT_TAG)
            echo "DEPLOYMENT_SHA=${DEPLOYMENT_SHA}" >> $GITHUB_ENV
          fi

      - name: Output deployment SHA
        run: echo "Deployment SHA is ${DEPLOYMENT_SHA}"

      - name: Ensure deployment SHA is set
        run: |
          if [ -z "${DEPLOYMENT_SHA}" ]; then
            echo "DEPLOYMENT_SHA is not set. Exiting."
            exit 1
          fi

      - name: configure aws credentials using OIDC role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{vars.AWS_ACCOUNT_ID}}:role/github_action_push_S3-canadalogin-static-website
          role-session-name: GHPushAppS3
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure deployment build exists
        run: |
          if ! aws s3 ls s3://${{ vars.STATIC_WEBSITE_BUILD_ARTIFACTS_S3_BUCKET }}/${DEPLOYMENT_SHA}/ ; then
            echo "No build artifacts found for SHA ${DEPLOYMENT_SHA} in bucket ${{ vars.STATIC_WEBSITE_BUILD_ARTIFACTS_S3_BUCKET }}. Exiting."
            exit 1
          fi

      - name: Deploy EN/FR build to app bucket
        run: |
          aws s3 sync \
            s3://${{ vars.STATIC_WEBSITE_BUILD_ARTIFACTS_S3_BUCKET }}/$DEPLOYMENT_SHA \
            s3://${{ vars.EN_S3_BUCKET }} --delete
          aws s3 sync \
            s3://${{ vars.STATIC_WEBSITE_BUILD_ARTIFACTS_S3_BUCKET }}/$DEPLOYMENT_SHA \
            s3://${{ vars.FR_S3_BUCKET }} --delete
          
      - name: Invalidate EN/FR Cloudfront caches
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.EN_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*" "/en/*" "/en/index.html"
          aws cloudfront create-invalidation --distribution-id ${{ vars.FR_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*" "/fr/*" "/fr/index.html"

  notify-slack-about-deploy-success:
    runs-on: ubuntu-latest
    needs: [notify-slack-about-deploy, deploy-website]
    if: success() && needs.notify-slack-about-deploy.outputs.envs != ''
    steps:
      - name: Notify slack about successful Deployments
        run: |
          workflow_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          json='{"text":":white_check_mark: '"${{ env.SLACK_NOTIFICATION_APPLICATION_NAME }}"' has been successfully deployed to the following environments: `'"${{ needs.notify-slack-about-deploy.outputs.envs }}"'`!\n\n<'"$workflow_url"'|Click for more details>"}'

          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.GC_SIGNIN_WEBSITE_OPS_SLACK_INFO_WEBHOOK }}

  notify-slack-about-deploy-failure:
    runs-on: ubuntu-latest
    needs: [notify-slack-about-deploy, deploy-website]
    if: failure() && needs.notify-slack-about-deploy.outputs.envs != ''
    steps:
      - name: Notify slack about failed Deployments
        run: |
          workflow_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          json='{"text":":x: '"${{ env.SLACK_NOTIFICATION_APPLICATION_NAME }}"' FAILED to deploy to the following environments: `'"${{ needs.notify-slack-about-deploy.outputs.envs }}"'`!\n\n<'"$workflow_url"'|Click for more details>"}'
          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.GC_SIGNIN_WEBSITE_OPS_SLACK_ALERT_WEBHOOK }}
