name: Check Links
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "website/src/**"
      - "src/**"
      - "lychee.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"

      - name: Install dependencies & build
        working-directory: website
        run: |
          npm install
          npm run build

      - name: Check internal links (broken pages)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --offline
            --no-progress
            'website/_site/**/*.html'
          fail: true
          output: /tmp/internal-links-report.md
          format: markdown

      - name: Report internal link errors
        if: failure()
        run: |
          if [ -s /tmp/internal-links-report.md ]; then
            echo "## :x: Broken Internal Links" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat /tmp/internal-links-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check anchor fragments (warnings)
        if: always()
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --config /dev/null
            --root-dir website/_site
            --index-files index.html
            --exclude '^mailto:'
            --exclude '^tel:'
            --exclude '\.pdf$'
            --exclude 'pagefind'
            --exclude '/design/.*-test-page'
            --exclude-path website/_site/components
            --exclude-path website/_site/assets
            --exclude-path website/_site/variables
            --exclude-path website/_site/en/design
            --exclude-path website/_site/fr/design
            --exclude-path website/_site/design
            'website/_site/**/*.html'
          fail: false
          output: /tmp/fragment-report.md
          format: markdown

      - name: Report broken anchors
        if: always()
        run: |
          if [ -s /tmp/fragment-report.md ]; then
            echo "## :warning: Broken Anchor Fragments" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "These links load the correct page but point to a missing or malformed anchor." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat /tmp/fragment-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check external links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --scheme https
            --scheme http
            'website/_site/**/*.html'
          fail: true
          output: /tmp/external-links-report.md
          format: markdown

      - name: Report external link errors
        if: failure()
        run: |
          if [ -s /tmp/external-links-report.md ]; then
            echo "## :x: Broken External Links" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat /tmp/external-links-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check footer links (gcds-footer JSON attributes)
        if: always()
        continue-on-error: true # Remove this when the check is stable and we want it to fail the workflow
        run: |
          node .github/workflows/scripts/check-json-attr-urls.js website/_site
